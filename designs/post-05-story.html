<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1080px; height: 1920px; overflow: hidden;
        font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      }
      .post {
        position: relative; width: 1080px; height: 1920px;
        background-image: url("file:///tmp/opencode/photos/street.jpg");
        background-size: cover; background-position: center 55%;
      }
      .wash {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(26,23,20,0.35) 0%, rgba(26,23,20,0) 35%, rgba(26,23,20,0.9) 100%);
      }
      .top {
        position: absolute; left: 64px; top: 72px;
        font-size: 17px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,252,244,0.7);
      }
      .block { position: absolute; left: 64px; right: 64px; bottom: 120px; color: #fffcf4; }
      .kicker { font-size: 17px; letter-spacing: 0.3em; text-transform: uppercase; color: #e9dfcf; }
      .title {
        margin-top: 22px;
        font-family: "Fraunces", serif; font-weight: 600; font-size: 96px; line-height: 1.02;
        letter-spacing: -0.03em; max-width: 820px;
      }
      .meta { margin-top: 30px; font-size: 21px; letter-spacing: 0.06em; color: rgba(255,252,244,0.65); }
      .swipe {
        position: absolute; left: 64px; right: 64px; bottom: 56px;
        display: flex; align-items: center; gap: 14px;
        font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,252,244,0.55);
      }
      .swipe .bar { flex: 1; height: 1px; background: rgba(255,252,244,0.3); }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="wash"></div>

      <p class="top">Story</p>

      <div class="block">
        <p class="kicker">Onehunga, 4pm</p>
        <h1 class="title">The street nobody asks about</h1>
        <p class="meta">Open House Studio · Sample format</p>
      </div>

      <div class="swipe">
        <span>Swipe up</span>
        <span class="bar"></span>
      </div>
    </div>
  </body>
</html>
