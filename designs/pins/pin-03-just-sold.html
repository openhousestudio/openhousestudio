<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pin-03-just-sold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1000px; height: 1500px; overflow: hidden;
        font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
        background: #f7f4ef;
      }
      .pin { position: relative; width: 1000px; height: 1500px; padding: 64px 64px 56px; display: flex; flex-direction: column; }
      .head { display: flex; align-items: baseline; justify-content: space-between; }
      .kicker { font-size: 17px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: #a94f2e; }
      .brand { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #6b6156; }
      .hook {
        margin-top: 26px; max-width: 840px;
        font-family: "Fraunces", Georgia, serif; font-weight: 600;
        font-size: 88px; line-height: 1.0; letter-spacing: -0.035em; color: #1a1714;
        white-space: pre-line;
      }
      .shot {
        margin: 52px auto 0; width: 680px; aspect-ratio: 4 / 5;
        background: #fffcf4; padding: 12px;
        box-shadow: 0 40px 90px -50px rgba(26,23,20,0.55), 0 2px 10px rgba(26,23,20,0.08);
      }
      .shot .img {
        width: 100%; height: 100%;
        background-image: url("file:///home/harvey/OpenCode/Open House Studio/site/public/community/post-03-just-sold.jpg");
        background-size: cover; background-position: center top;
      }
      .foot {
        margin-top: auto; padding-top: 26px; border-top: 1px solid #e4dcd1;
        display: flex; align-items: baseline; justify-content: space-between;
        font-size: 15px; color: #6b6156;
      }
      .foot .url { color: #1a1714; font-weight: 500; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="pin">
      <div class="head">
        <span class="kicker">Just sold</span>
        <span class="brand">Open House Studio</span>
      </div>
      <h1 class="hook">Sold.
Here&rsquo;s the post.</h1>
      <div class="shot"><div class="img"></div></div>
      <div class="foot">
        <span>Sample design, not a real listing</span>
        <span class="url">openhousestudio.online/community</span>
      </div>
    </div>
  </body>
</html>
