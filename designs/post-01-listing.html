<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Listing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1080px; height: 1350px; overflow: hidden;
        font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
        background: #fffcf4;
      }
      .post { position: relative; width: 1080px; height: 1350px; }
      .photo {
        position: absolute; inset: 0 0 auto 0; height: 820px;
        background-image: url("file:///tmp/opencode/photos/exterior.jpg");
        background-size: cover; background-position: center 60%;
      }
      .panel { position: absolute; inset: 820px 0 0 0; background: #fffcf4; }
      .eyebrow {
        position: absolute; left: 72px; top: 878px;
        font-size: 19px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
        color: #a94f2e;
      }
      .address {
        position: absolute; left: 72px; top: 926px; width: 620px;
        font-family: "Fraunces", serif; font-weight: 600; font-size: 92px; line-height: 0.98;
        letter-spacing: -0.03em; color: #1a1714;
      }
      .suburb {
        position: absolute; left: 72px; top: 1128px;
        font-size: 24px; color: #6b6156;
      }
      .details {
        position: absolute; right: 72px; top: 930px; width: 260px; text-align: right;
      }
      .row {
        display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
        padding: 11px 0; border-bottom: 1px solid #e4dcd1;
        font-size: 19px; color: #6b6156;
      }
      .row span { font-weight: 500; color: #1a1714; font-variant-numeric: tabular-nums; }
      .price {
        position: absolute; left: 72px; bottom: 72px;
        font-family: "Fraunces", serif; font-weight: 600; font-size: 74px;
        letter-spacing: -0.02em; color: #1a1714;
      }
      .agent {
        position: absolute; right: 72px; bottom: 84px; text-align: right;
        font-size: 18px; line-height: 1.6; color: #6b6156;
      }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="photo"></div>
      <div class="panel"></div>

      <p class="eyebrow">Just listed</p>
      <h1 class="address">Awa Road</h1>
      <p class="suburb">Onehunga</p>

      <div class="details">
        <div class="row">Bedrooms <span>4</span></div>
        <div class="row">Bathrooms <span>2</span></div>
        <div class="row">Garage <span>2</span></div>
      </div>

      <p class="price">$1,240,000</p>
      <p class="agent">[Your name]<br />[phone]</p>
    </div>
  </body>
</html>
