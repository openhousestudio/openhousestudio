<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Just sold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1080px; height: 1350px; overflow: hidden;
        font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
        background: #e9dfcf;
      }
      .post { position: relative; width: 1080px; height: 1350px; }
      .frame {
        position: absolute; right: 84px; top: 110px; width: 400px; height: 500px;
        background: #fffcf4; padding: 14px;
        box-shadow: 0 26px 60px -30px rgba(26,23,20,0.55);
      }
      .frame .img {
        width: 100%; height: 100%;
        background-image: url("file:///tmp/opencode/photos/garden.jpg");
        background-size: cover; background-position: center;
      }
      .eyebrow {
        position: absolute; left: 88px; top: 150px;
        font-size: 18px; letter-spacing: 0.3em; text-transform: uppercase; color: #a94f2e;
      }
      .sold {
        position: absolute; left: 78px; top: 210px;
        font-family: "Fraunces", serif; font-weight: 600; font-size: 230px; line-height: 0.9;
        letter-spacing: -0.05em; color: #1a1714;
      }
      .result {
        position: absolute; left: 88px; top: 700px; max-width: 560px;
        font-family: "Fraunces", serif; font-size: 46px; line-height: 1.25; color: #1a1714;
      }
      .meta {
        position: absolute; left: 88px; bottom: 150px;
        font-size: 21px; line-height: 1.7; color: #5a5148;
      }
      .meta strong { display: block; font-weight: 500; color: #1a1714; }
      .line {
        position: absolute; left: 88px; right: 88px; bottom: 118px;
        height: 1px; background: rgba(26,23,20,0.18);
      }
      .tag {
        position: absolute; right: 88px; bottom: 58px;
        font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; color: #6b6156;
      }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="frame"><div class="img"></div></div>

      <p class="eyebrow">Just sold</p>
      <h1 class="sold">Sold</h1>
      <p class="result">Under offer in nine days, to a family who had been looking on this street for a year.</p>

      <p class="meta"><strong>Awa Road, Onehunga</strong>[Your name] · [phone]</p>
      <div class="line"></div>
      <p class="tag">Open House Studio</p>
    </div>
  </body>
</html>
