<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Listing 01 — glass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1714;
        --muted: #5a5148;
        --primary: #a94f2e;
        --accent: #c4643f;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .post {
        position: relative;
        width: 1080px;
        height: 1350px;
        background-color: #d8cfc2;
        background-image: url("file:///tmp/opencode/house.png");
        background-size: cover;
        background-position: center 55%;
      }

      /* slight grade so the bottom of the photo holds the glass */
      .grade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(26, 23, 20, 0) 40%,
          rgba(26, 23, 20, 0.18) 100%
        );
      }

      .glass {
        position: absolute;
        left: 48px;
        right: 48px;
        bottom: 48px;
        border-radius: 44px;
        padding: 44px 44px 40px;
        overflow: hidden;
        background: linear-gradient(
          140deg,
          rgba(255, 253, 250, 0.52),
          rgba(255, 253, 250, 0.28)
        );
        -webkit-backdrop-filter: blur(28px) saturate(1.45);
        backdrop-filter: blur(28px) saturate(1.45);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.78) inset,
          0 -1px 0 rgba(255, 255, 255, 0.22) inset,
          0 24px 60px -20px rgba(26, 23, 20, 0.55),
          0 2px 8px rgba(26, 23, 20, 0.18);
      }

      .sheen {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background:
          radial-gradient(120% 60% at 15% 0%, rgba(255, 255, 255, 0.55), transparent 55%),
          linear-gradient(
            115deg,
            rgba(255, 255, 255, 0.30) 0%,
            rgba(255, 255, 255, 0) 35%,
            rgba(255, 255, 255, 0) 65%,
            rgba(255, 255, 255, 0.12) 100%
          );
        mix-blend-mode: screen;
      }

      .refract {
        position: absolute;
        left: 18px;
        right: 18px;
        top: 1px;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.7) 18%,
          rgba(255, 255, 255, 0.45) 55%,
          rgba(255, 255, 255, 0) 100%
        );
        pointer-events: none;
      }

      .content { position: relative; }

      .eyebrow {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--primary);
      }

      .headline {
        margin-top: 14px;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 86px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      .list { margin-top: 26px; }

      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 13px 24px;
        font-size: 26px;
        color: #3a332c;
      }

      .row + .row { border-top: 1px solid rgba(26, 23, 20, 0.10); }

      .row .label { color: #5d544a; }

      .row .value {
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      .footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: 26px;
        padding-top: 24px;
        border-top: 1px solid rgba(26, 23, 20, 0.12);
      }

      .price {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 56px;
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      .agent {
        margin-top: 6px;
        font-size: 22px;
        font-weight: 500;
        color: #3f382f;
      }

      .mark { width: 38px; height: 38px; opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="grade"></div>

      <div class="glass">
        <div class="sheen"></div>
        <div class="refract"></div>

        <div class="content">
          <p class="eyebrow">Just listed</p>
          <h1 class="headline">14 Awa Road</h1>

          <div class="list">
            <div class="row">
              <span class="label">Bedrooms</span>
              <span class="value">4</span>
            </div>
            <div class="row">
              <span class="label">Bathrooms</span>
              <span class="value">2</span>
            </div>
            <div class="row">
              <span class="label">Garage</span>
              <span class="value">2</span>
            </div>
          </div>

          <div class="footer">
            <div>
              <p class="price">$1,240,000</p>
              <p class="agent">[Your name] · [phone]</p>
            </div>

            <svg class="mark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <rect x="56" y="32" width="88" height="136" fill="#FFFDFA"></rect>
              <path d="M56 32 L118 44 L118 156 L56 168 Z" fill="#C4643F"></path>
              <rect x="56.5" y="34" width="2.5" height="132" fill="#FFFDFA"></rect>
              <rect x="104" y="98" width="8" height="8" rx="2" fill="#FFFDFA"></rect>
              <rect x="50" y="26" width="100" height="148" rx="9" fill="none" stroke="#C4643F" stroke-width="12"></rect>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
