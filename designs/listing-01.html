<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Listing 01</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f4ef;
        --ink: #1a1714;
        --card: #fffdfa;
        --muted: #6b6156;
        --line: #e4dcd1;
        --primary: #a94f2e;
        --accent: #c4643f;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--card);
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .post {
        position: relative;
        width: 1080px;
        height: 1350px;
        background: var(--card);
      }

      .photo {
        position: absolute;
        inset: 0 0 auto 0;
        height: 760px;
        background-color: #d8cfc2;
        background-image: url("file:///tmp/opencode/house.png");
        background-size: cover;
        background-position: center 55%;
      }

      /* blend the photo into the card so type never fights the image */
      .scrim {
        position: absolute;
        left: 0;
        right: 0;
        top: 500px;
        height: 260px;
        background: linear-gradient(
          to bottom,
          rgba(26, 23, 20, 0) 0%,
          rgba(26, 23, 20, 0.28) 55%,
          rgba(255, 253, 250, 0.92) 96%,
          #fffdfa 100%
        );
      }

      .rule-accent {
        position: absolute;
        left: 80px;
        top: 860px;
        width: 64px;
        height: 4px;
        background: var(--primary);
      }

      .eyebrow {
        position: absolute;
        left: 80px;
        top: 812px;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--primary);
      }

      .headline {
        position: absolute;
        left: 80px;
        top: 892px;
        width: 920px;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 92px;
        line-height: 1.04;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      .details {
        position: absolute;
        left: 80px;
        top: 1030px;
        width: 920px;
        font-size: 32px;
        color: var(--muted);
      }

      .rule {
        position: absolute;
        left: 80px;
        top: 1100px;
        width: 920px;
        height: 1px;
        background: var(--line);
      }

      .price {
        position: absolute;
        left: 80px;
        top: 1128px;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 60px;
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      .agent {
        position: absolute;
        left: 80px;
        top: 1232px;
        font-size: 24px;
        color: var(--muted);
      }

      .mark {
        position: absolute;
        right: 80px;
        top: 1222px;
        width: 40px;
        height: 40px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="photo"></div>
      <div class="scrim"></div>

      <p class="eyebrow">Just listed</p>
      <div class="rule-accent"></div>

      <h1 class="headline">14 Awa Road</h1>
      <p class="details">4 bed · 2 bath · 2 garage</p>

      <div class="rule"></div>
      <p class="price">$1,240,000</p>
      <p class="agent">[Your name] · [phone]</p>

      <svg class="mark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="56" y="32" width="88" height="136" fill="#FFFDFA"></rect>
        <path d="M56 32 L118 44 L118 156 L56 168 Z" fill="#C4643F"></path>
        <rect x="56.5" y="34" width="2.5" height="132" fill="#FFFDFA"></rect>
        <rect x="104" y="98" width="8" height="8" rx="2" fill="#FFFDFA"></rect>
        <rect x="50" y="26" width="100" height="148" rx="9" fill="none" stroke="#C4643F" stroke-width="12"></rect>
      </svg>
    </div>
  </body>
</html>
